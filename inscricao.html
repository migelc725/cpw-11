<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Clube do Zambujal</title>
</head>
<body>
    <header>
        <h1>Clube do Zambujal</h1>
        <p>Inscreve-te nas nossas oficinas!</p>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="atividades.html">Atividades</a></li>
            <li><a href="inscricao.html">Inscrição</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulário de inscrição</h2>

        <form action="inscricao.html" method="get">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="oficina">Escolhe uma oficina:</label>
                <select id="oficina" name="oficina" required>
                    <option value="">-- Escolhe uma oficina --</option>
                    <option value="paginas-web">Páginas Web</option>
                    <option value="robotica">Robótica</option>
                    <option value="futebol">Futebol</option>
                </select>
            </p>

            <p>
                <label for="mensagem">Mensagem (opcional):</label>
                <textarea id="mensagem" name="mensagem"></textarea>
            </p>

            <button type="submit">Testar inscrição</button>
        </form>
    </main>

    <footer>
        <p>Clube do Zambujal</p>
    </footer>
</body>
</html>
