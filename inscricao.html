<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Oficinas de Robótica</title>
</head>
<body>
    <header>
        <h1>Oficinas de Robótica</h1>
        <p>Inscreve-te nas nossas oficinas!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>

            <li><a href="../cpw-11/oficina.html">Oficinas</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulário de inscrição</h2>

        <form action="inscricao.html" method="get">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="oficina">Escolhe uma oficina:</label>
                <select id="oficina" name="oficina" required>
                    <option value="">-- Escolhe uma oficina --</option>
                    <option value="e">Utilização de equipamentos</option>
                    <option value="robotica">Robótica</option>
                </select>
            </p>

            <button type="submit">Submeter inscrição</button>
        </form>
    </main>

    <footer>
        <p>Oficinas de Robótica | Clube do Zambujal</p>
    </footer>
</body>
</html>
